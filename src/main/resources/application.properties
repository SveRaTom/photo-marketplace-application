spring.application.name=Photo Marketplace Application
spring.profiles.default=dev
server.port=${MAIN_APP_PORT:8080}

spring.jpa.hibernate.ddl-auto=update
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.url=${MAIN_DB_URL:jdbc:mysql://localhost:3306/photo_marketplace_app_db?createDatabaseIfNotExist=true}
spring.datasource.username=${MAIN_DB_USERNAME:}
spring.datasource.password=${MAIN_DB_PASSWORD:}
logging.level.org.hibernate.persister.entity=ERROR
spring.jpa.open-in-view=false

spring.mvc.hiddenmethod.filter.enabled=true
server.error.whitelabel.enabled=false
server.error.include-message=never
server.error.include-stacktrace=never

app.photographer.password=${APP_PHOTOGRAPHER_PASSWORD:}
app.client.password=${APP_CLIENT_PASSWORD:}
app.admin.password=${APP_ADMIN_PASSWORD:}

integration.custom-offer-service.base-url=${CUSTOM_OFFER_SERVICE_URL:http://localhost:8081}

scheduling.offer-expiration.cron=0 0 2 * * *
scheduling.offer-expiration.stale-days=90
scheduling.booking-completion.fixed-delay-ms=3600000
scheduling.booking-completion.initial-delay-ms=60000
