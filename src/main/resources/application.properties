spring.application.name=Photo Marketplace Application
spring.profiles.default=dev

# Base configuration
spring.jpa.hibernate.ddl-auto=update
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/photo_marketplace_app_db?createDatabaseIfNotExist=true
spring.datasource.username=
spring.datasource.password=
logging.level.org.hibernate.persister.entity=ERROR
spring.jpa.open-in-view=false

spring.mvc.hiddenmethod.filter.enabled=true
server.error.whitelabel.enabled=false
server.error.include-message=never
server.error.include-stacktrace=never

app.photographer.password=
app.client.password=
app.admin.password=

integration.custom-offer-service.base-url=${CUSTOM_OFFER_SERVICE_URL:http://localhost:8081}

scheduling.offer-expiration.cron=0 0 2 * * *
scheduling.offer-expiration.stale-days=90
scheduling.booking-completion.fixed-delay-ms=3600000
scheduling.booking-completion.initial-delay-ms=60000
