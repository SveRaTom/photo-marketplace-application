spring.application.name=Photo Marketplace Custom Offer Service
server.port=${CUSTOM_OFFER_SERVICE_PORT:8081}

spring.datasource.url=${CUSTOM_OFFER_DB_URL:jdbc:mysql://localhost:3306/photo_marketplace_custom_offer_db?createDatabaseIfNotExist=true}
spring.datasource.username=${CUSTOM_OFFER_DB_USERNAME:}
spring.datasource.password=${CUSTOM_OFFER_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info
